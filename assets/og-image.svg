<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Syne:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title { font-family: 'Syne', sans-serif; font-weight: 800; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
      .sans { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Warm Cream -->
  <rect width="1200" height="630" fill="#FFFDF8"/>

  <!-- Grid texture -->
  <g stroke="#18181B" stroke-opacity="0.06" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
  </g>

  <!-- Outer frame border with brutalist margins -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#18181B" stroke-width="4"/>

  <!-- Top bar -->
  <rect x="40" y="40" width="1120" height="60" fill="#18181B"/>
  <text x="70" y="78" fill="#FFFDF8" class="mono" font-size="18" letter-spacing="0.1em">IEDC BOOTCAMP CEC // OFFICIAL IDEATHON 2026</text>
  <rect x="1000" y="52" width="130" height="36" rx="6" fill="#34D399"/>
  <text x="1065" y="75" fill="#18181B" class="mono" font-size="14" text-anchor="middle">LIVE EVENT</text>

  <!-- Main Headline Block -->
  <g transform="translate(80, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="38" rx="4" fill="#FDE047" stroke="#18181B" stroke-width="2.5"/>
    <text x="14" y="24" fill="#18181B" class="mono" font-size="13" letter-spacing="0.08em">24-HOUR STUDENT SPRINT</text>

    <!-- Title -->
    <text x="0" y="110" fill="#18181B" class="title" font-size="76" letter-spacing="-0.03em">IEDC IDEA</text>
    <text x="0" y="195" fill="#1D4ED8" class="title" font-size="76" letter-spacing="-0.03em">SPRINT <tspan fill="#FF5A36">2026</tspan></text>

    <!-- Tagline -->
    <text x="0" y="250" fill="#18181B" class="sans" font-size="24">One problem. One team. 24 hours to build the future.</text>
  </g>

  <!-- Right Side Interactive Graphic: Idea Reel Preview Card -->
  <g transform="translate(740, 150)">
    <!-- Card hard shadow -->
    <rect x="10" y="10" width="370" height="380" rx="12" fill="#18181B"/>
    <!-- Card body -->
    <rect x="0" y="0" width="370" height="380" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/>

    <!-- Reel title -->
    <rect x="0" y="0" width="370" height="50" rx="12" fill="#DDD6FE" stroke="#18181B" stroke-width="3"/>
    <text x="24" y="32" fill="#18181B" class="mono" font-size="14" letter-spacing="0.06em">RANDOM IDEA GENERATOR</text>

    <!-- Slot 1 -->
    <rect x="24" y="75" width="322" height="65" rx="8" fill="#FFFDF8" stroke="#18181B" stroke-width="2"/>
    <text x="40" y="98" fill="#747686" class="mono" font-size="11">01 / DOMAIN</text>
    <text x="40" y="123" fill="#18181B" class="title" font-size="18">CLIMATE &amp; CLEAN TECH</text>

    <!-- Slot 2 -->
    <rect x="24" y="155" width="322" height="65" rx="8" fill="#FFFDF8" stroke="#18181B" stroke-width="2"/>
    <text x="40" y="178" fill="#747686" class="mono" font-size="11">02 / TECHNOLOGY</text>
    <text x="40" y="203" fill="#18181B" class="title" font-size="18">EDGE AI &amp; SENSORS</text>

    <!-- Slot 3 -->
    <rect x="24" y="235" width="322" height="65" rx="8" fill="#FFFDF8" stroke="#18181B" stroke-width="2"/>
    <text x="40" y="258" fill="#747686" class="mono" font-size="11">03 / CONSTRAINT</text>
    <text x="40" y="283" fill="#18181B" class="title" font-size="18">WORKS 100% OFFLINE</text>

    <!-- Sticker on card -->
    <g transform="translate(250, 315) rotate(-6)">
      <rect x="0" y="0" width="110" height="34" rx="4" fill="#FF5A36" stroke="#18181B" stroke-width="2"/>
      <text x="55" y="22" fill="#FFFFFF" class="mono" font-size="13" text-anchor="middle">SPIN NOW ⚡</text>
    </g>
  </g>

  <!-- Bottom Badges Strip -->
  <g transform="translate(80, 480)">
    <!-- Prize pool badge -->
    <rect x="0" y="0" width="190" height="65" rx="8" fill="#FDE047" stroke="#18181B" stroke-width="2.5"/>
    <text x="18" y="25" fill="#18181B" class="mono" font-size="11">TOTAL PRIZES</text>
    <text x="18" y="50" fill="#18181B" class="title" font-size="22">₹50,000+</text>

    <!-- Location -->
    <rect x="210" y="0" width="220" height="65" rx="8" fill="#DDD6FE" stroke="#18181B" stroke-width="2.5"/>
    <text x="228" y="25" fill="#18181B" class="mono" font-size="11">VENUE</text>
    <text x="228" y="50" fill="#18181B" class="sans" font-size="17" font-weight="700">CEC Campus, Kerala</text>

    <!-- Date -->
    <rect x="450" y="0" width="230" height="65" rx="8" fill="#34D399" stroke="#18181B" stroke-width="2.5"/>
    <text x="468" y="25" fill="#18181B" class="mono" font-size="11">TIMELINE</text>
    <text x="468" y="50" fill="#18181B" class="mono" font-size="16" font-weight="700">NOV 21-22, 2026</text>
  </g>
</svg>
